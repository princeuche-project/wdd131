    <main>
        <h1>Product Review</h1>
        <form action="review.html" method="get" class="container">
            <fieldset>
                <legend>Product Review</legend>
                <select name="productName" id="product" required>
                    <option value="">Choose a Product &#9662;</option>
                </select>

            </fieldset>

            <fieldset class="stars">
                <legend>Overall Rating</legend>
                <label for="fivestar"><input type="radio" id="fivestar" name="stars" value="5" required></label>
                <label for="fourstar"><input type="radio" id="fourstar" name="stars" value="4" required></label>
                <label for="threestar"><input type="radio" id="threestar" name="stars" value="3" required></label>
                <label for="twostar"><input type="radio" id="twostar" name="stars" value="2" required></label>
                <label for="onestar"><input type="radio" id="onestar" name="stars" value="1" required></label>
            </fieldset>

            <fieldset>
                <legend>Date of Installation</legend>
                <input type="date" id="date" name="date" required>
            </fieldset>
            <fieldset>
                <legend>Which features did you find useful in the product?</legend>
                <p><strong>Check all that apply</strong></p>

                <label><input type="checkbox" name="durability" value="yes">Durability</label>
                <label><input type="checkbox" name="easeofuse" value="yes">Ease of Use</label>
                <label><input type="checkbox" name="performance" value="yes">Performance</label>
                <label><input type="checkbox" name="design" value="yes">Design</label>
            </fieldset>

            <fieldset>
                <legend>Written Review (Optional)</legend>
                <textarea name="text" id="review"></textarea>
            </fieldset>
            <fieldset>
                <legend>Your Name (Optional)</legend>
                <label for="name">
                    <input type="text" name="yourname" id="yourname">
                </label>
            </fieldset>

            <input type="submit" value="Post Review">


        </form>



    </main>


    <footer>

        <p id="year">
            <span></span>
        </p>
        <p id="lastModified"></p>
    </footer>
